version: 2

models:
  - name: goldtable_referer
    description: "Analyse des referer et requêtes Google avec volumes"
    columns:
      - name: source_type
        description: "Type de source : referer ou google_query"
        tests:
          - not_null

      - name: referer_or_query
        description: "URL du referer ou requête Google"
        tests:
          - not_null

      - name: nb_hits
        description: "Nombre total de requêtes"
        tests:
          - not_null

      - name: nb_users
        description: "Nombre d'utilisateurs uniques"
        tests:
          - not_null
  - name: goldtable_top_page_traffic
    description: "Pages générant le plus de trafic sur le site"
    columns:
      - name: page
        description: "URL de la page visitée"
        tests:
          - not_null

      - name: nb_hits
        description: "Nombre total de visites sur la page"
        tests:
          - not_null

      - name: nb_users
        description: "Nombre d'utilisateurs uniques ayant visité la page"
        tests:
          - not_null
  - name: gold_usage_kpis
    description: "Indicateurs globaux d'usage : trafic horaire, durée moyenne de session, mobile vs desktop"
    columns:
      - name: min_users_per_hour
        description: "Nombre minimum d'utilisateurs uniques par heure"
        tests:
          - not_null

      - name: max_users_per_hour
        description: "Nombre maximum d'utilisateurs uniques par heure"
        tests:
          - not_null

      - name: avg_users_per_hour
        description: "Nombre moyen d'utilisateurs uniques par heure"
        tests:
          - not_null

      - name: avg_session_duration_seconds
        description: "Durée moyenne d'une session utilisateur en secondes"
        tests:
          - not_null

      - name: mobile_users
        description: "Nombre d'utilisateurs uniques sur mobile"
        tests:
          - not_null

      - name: desktop_users
        description: "Nombre d'utilisateurs uniques sur desktop"
        tests:
          - not_null


  - name: goldtable_error_pages
    description: "Pages générant le plus d'erreurs HTTP"
    columns:
      - name: page
        description: "URL de la page"
        tests:
          - not_null

      - name: nb_errors
        description: "Nombre d'erreurs générées par la page"
        tests:
          - not_null

      - name: nb_users_impacted
        description: "Nombre d'utilisateurs distincts ayant rencontré une erreur sur cette page"
        tests:
          - not_null
